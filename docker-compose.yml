services:

  db:
    image: postgres:15
    container_name: petcenter_db
    restart: always
    environment:
      POSTGRES_DB: petcenter
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - petcenter_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d petcenter"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgrest:
    image: postgrest/postgrest:v12.0.2
    container_name: petcenter_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: postgres://admin:secret@petcenter_db:5432/petcenter
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: admin
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - petcenter_net

networks:
  petcenter_net:
    driver: bridge

volumes:
  postgres_data: